[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmcron"
version = "0.3.0"
description = "Zero-dependency DAG cron scheduler & machine execution receipt engine for AI agent swarms and microservices."
readme = "README.md"
authors = [{ name = "Michael Gulden", email = "michael@growthwebdev.com" }]
license = "MIT"
requires-python = ">=3.10"
keywords = ["cron", "scheduler", "dag", "swarm", "agent", "fastapi", "machine-receipts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]

[project.scripts]
swarmcron = "swarmcron.cli:main"

[project.urls]
Homepage = "https://github.com/mbgulden/swarmcron"
Repository = "https://github.com/mbgulden/swarmcron.git"
Changelog = "https://github.com/mbgulden/swarmcron/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
swarmcron = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
